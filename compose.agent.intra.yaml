name: intra-dorify-agent

services:
  agent:
    image: dorify/agent:dev
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_PORT: 3100
      DB_MAX_CONNECTIONS: 100
      DB_RESERVED_CONNECTIONS: 20
      DB_API_INSTANCES: 1
      DB_POOL_MAX: 10
      DB_AGENT_INSTANCES: 1
      DB_AGENT_POOL_MAX: 3
      DB_WORKER_CONNECTIONS: 0
      DB_CONNECTION_TIMEOUT_MS: 5000
      DB_STATEMENT_TIMEOUT_MS: 30000
      DB_LOCK_TIMEOUT_MS: 3000
      DB_IDLE_TRANSACTION_TIMEOUT_MS: 15000
      REALTIME_SAFETY_REFRESH_MS: 300000
      AGENT_POLL_INTERVAL_MS: ${AGENT_POLL_INTERVAL_MS:-30000}
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-10000}
      DATABASE_URL: postgresql://dori:dori_password@postgres:5432/dori
      DORIFY_ENGINE_URL: http://engine:3000
      DORIFY_CLOUD_URL: ${DORIFY_CLOUD_URL:-http://host.docker.internal:53000}
      DORIFY_INSTALLATION_ID: ${DORIFY_INSTALLATION_ID:-824a8a33-3aa6-4c6d-85d0-ceb6c5bdf5c9}
      DORIFY_CLOUD_TOKEN: ${DORIFY_CLOUD_TOKEN:-b7a2a0e8-c617-49c8-8c01-a1fd1eec3761-5adce22fe4622c47b5bddbce4c2563a628e6f713ae47aaae24897a3dc0a90bd9}
      DORIFY_ENGINE_VERSION: ${DORIFY_ENGINE_VERSION:-dev}
      DORIFY_APP_VERSION: ${DORIFY_APP_VERSION:-dev}
      DORIFY_AGENT_VERSION: ${DORIFY_AGENT_VERSION:-0.1.0}
    ports:
      - '127.0.0.1:13100:3100'
    networks:
      - dorify-intra-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  dorify-intra-network:
    external: true
